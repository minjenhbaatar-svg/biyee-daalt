<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>2D 1v1 Glitch Fighter</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh; 
            overflow: hidden; color: white; font-family: 'Courier New', Courier, monospace; 
        }
        #game-container { position: relative; width: 100vw; height: 80vh; display: flex; justify-content: center; }
        canvas { background: #222; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 100%; height: 100%; object-fit: contain; border-bottom: 5px solid #444; }
        .ui-container { position: absolute; top: 20px; width: 90%; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .hp-wrapper { width: 40%; }
        .hp-label { margin-bottom: 5px; font-weight: bold; text-shadow: 2px 2px black; }
        .health-bar { height: 25px; background: rgba(255, 0, 0, 0.3); border: 2px solid #fff; }
        .health-inner { height: 100%; background: #ff416c; width: 100%; transition: width 0.1s; }
        .controls-info { display: flex; justify-content: space-around; width: 100%; padding: 20px; background: #111; }
        .key-hint { background: #444; padding: 3px 10px; border-radius: 4px; margin: 0 5px; }

        /* Дахин эхлүүлэх товчлуур */
        #restart-screen {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: rgba(0, 0, 0, 0.8); padding: 40px; border: 4px solid #fff; z-index: 20;
        }
        #restart-btn {
            margin-top: 20px; padding: 15px 30px; font-size: 1.2rem; cursor: pointer;
            background: #f1c40f; border: none; font-weight: bold; font-family: inherit;
        }
        #restart-btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-container">
            <div class="hp-wrapper">
                <div class="hp-label">PLAYER 1</div>
                <div class="health-bar"><div id="p1-health" class="health-inner"></div></div>
            </div>
            <div id="status-text" style="font-size: 2rem; color: #f1c40f; font-weight: bold;">FIGHT</div>
            <div class="hp-wrapper">
                <div class="hp-label" style="text-align: right;">PLAYER 2</div>
                <div class="health-bar"><div id="p2-health" class="health-inner"></div></div>
            </div>
        </div>

        <div id="restart-screen">
            <h1 id="win-text">ТОГЛООМ ДУУСЛАА</h1>
            <button id="restart-btn" onclick="resetGame()">ДАХИН ЭХЛҮҮЛЭХ</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-info">
        <div>P1: <span class="key-hint">W,A,D</span> Хөдлөх | <span class="key-hint">SPACE</span> Цохих</div>
        <div>P2: <span class="key-hint">Сумнууд</span> Хөдлөх | <span class="key-hint">ENTER</span> Цохих</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 576;

    const gravity = 0.8;
    let gameOver = false;

    class Fighter {
        constructor({ position, color, isPlayer2 }) {
            this.position = position;
            this.velocity = { x: 0, y: 0 };
            this.width = 50;
            this.height = 150;
            this.color = color;
            this.health = 100;
            this.isAttacking = false;
            this.isPlayer2 = isPlayer2;
            this.facing = isPlayer2 ? -1 : 1; // 1 = Баруун, -1 = Зүүн
            
            this.attackBox = {
                width: 100,
                height: 50
            };
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

            // Нүд (аль тал руу харж байгааг илтгэнэ)
            ctx.fillStyle = 'black';
            const eyeX = this.facing === 1 ? this.position.x + 35 : this.position.x + 5;
            ctx.fillRect(eyeX, this.position.y + 20, 10, 10);

            if (this.isAttacking) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const attackX = this.facing === 1 ? this.position.x + this.width : this.position.x - this.attackBox.width;
                ctx.fillRect(attackX, this.position.y + 20, this.attackBox.width, this.attackBox.height);
            }
        }

        update() {
            this.draw();
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;

            if (this.position.y + this.height + this.velocity.y >= canvas.height) {
                this.velocity.y = 0;
                this.position.y = canvas.height - this.height;
            } else {
                this.velocity.y += gravity;
            }

            // Харах чиглэлийг тодорхойлох
            if (this.velocity.x > 0) this.facing = 1;
            if (this.velocity.x < 0) this.facing = -1;
        }

        attack() {
            this.isAttacking = true;
            setTimeout(() => { this.isAttacking = false; }, 100);
        }
    }

    let player1 = new Fighter({ position: { x: 150, y: 0 }, color: '#3498db', isPlayer2: false });
    let player2 = new Fighter({ position: { x: 824, y: 0 }, color: '#e74c3c', isPlayer2: true });

    const keys = { a: { pressed: false }, d: { pressed: false }, ArrowLeft: { pressed: false }, ArrowRight: { pressed: false } };

    function rectCollision(f1, f2) {
        const f1AttackX = f1.facing === 1 ? f1.position.x + f1.width : f1.position.x - f1.attackBox.width;
        return (
            f1AttackX + f1.attackBox.width >= f2.position.x &&
            f1AttackX <= f2.position.x + f2.width &&
            f1.position.y + f1.attackBox.height >= f2.position.y &&
            f1.position.y <= f2.position.y + f2.height
        );
    }

    function animate() {
        if (gameOver) return;
        window.requestAnimationFrame(animate);
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        player1.update();
        player2.update();

        player1.velocity.x = 0;
        if (keys.a.pressed) player1.velocity.x = -7; else if (keys.d.pressed) player1.velocity.x = 7;

        player2.velocity.x = 0;
        if (keys.ArrowLeft.pressed) player2.velocity.x = -7; else if (keys.ArrowRight.pressed) player2.velocity.x = 7;

        if (player1.isAttacking && rectCollision(player1, player2)) {
            player1.isAttacking = false;
            player2.health -= 10;
            document.getElementById('p2-health').style.width = player2.health + '%';
        }
        if (player2.isAttacking && rectCollision(player2, player1)) {
            player2.isAttacking = false;
            player1.health -= 10;
            document.getElementById('p1-health').style.width = player1.health + '%';
        }

        if (player1.health <= 0 || player2.health <= 0) {
            gameOver = true;
            document.getElementById('restart-screen').style.display = 'block';
            document.getElementById('win-text').innerText = player1.health <= 0 ? "PLAYER 2 ЯЛЛАА!" : "PLAYER 1 ЯЛЛАА!";
        }
    }

    function resetGame() {
        player1 = new Fighter({ position: { x: 150, y: 0 }, color: '#3498db', isPlayer2: false });
        player2 = new Fighter({ position: { x: 824, y: 0 }, color: '#e74c3c', isPlayer2: true });
        document.getElementById('p1-health').style.width = '100%';
        document.getElementById('p2-health').style.width = '100%';
        document.getElementById('restart-screen').style.display = 'none';
        gameOver = false;
        animate();
    }

    window.addEventListener('keydown', (e) => {
        if (gameOver) return;
        switch (e.key) {
            case 'd': keys.d.pressed = true; break;
            case 'a': keys.a.pressed = true; break;
            case 'w': if (player1.velocity.y === 0) player1.velocity.y = -20; break;
            case ' ': player1.attack(); break;
            case 'ArrowRight': keys.ArrowRight.pressed = true; break;
            case 'ArrowLeft': keys.ArrowLeft.pressed = true; break;
            case 'ArrowUp': if (player2.velocity.y === 0) player2.velocity.y = -20; break;
            case 'Enter': player2.attack(); break;
        }
    });

    window.addEventListener('keyup', (e) => {
        switch (e.key) {
            case 'd': keys.d.pressed = false; break;
            case 'a': keys.a.pressed = false; break;
            case 'ArrowRight': keys.ArrowRight.pressed = false; break;
            case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
        }
    });

    animate();
</script>
</body>
</html>
